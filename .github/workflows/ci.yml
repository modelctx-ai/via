name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest / tsup 要求 Node 22.12+，开发与测试在 22、24 上跑。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # 发布产物声明支持 Node 20（engines），开发工具链却需要 22+：在 22 上打包，换到 20 上跑打包结果。
  runtime-node20:
    name: runtime (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node --version
      # 空的 HOME 与工作目录，避免读到 runner 上的配置；doctor 会加载配置解析等懒加载的 chunk。
      - name: run bundle
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/home/.cache"
          mkdir -p "$HOME" "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          via="$GITHUB_WORKSPACE/dist/via.js"
          node "$via" --version
          node "$via"
          node "$via" doctor

  # 单文件可执行（bun build --compile）：在 Linux 与 macOS 上打出本机版本，跑冒烟测试（test/cli/bin.test.ts）。
  # VIA_REQUIRE_BUN 让「找不到 bun」成为失败，而不是静默跳过。
  binary:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      VIA_REQUIRE_BUN: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: bun --version
      - run: npm run build:bin
      - name: smoke test
        run: npx vitest run test/cli/bin.test.ts test/bin-targets.test.ts test/runtime.test.ts
      # 离开仓库、用空的 HOME 运行：二进制不能依赖 node_modules 或源码目录。
      - name: run the binary outside the repository
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/home/.cache"
          mkdir -p "$HOME" "$RUNNER_TEMP/work"
          cp "$(ls dist/bin/via-* | grep -v '\.sha256$')" "$RUNNER_TEMP/work/via"
          cd "$RUNNER_TEMP/work"
          ./via --version
          ./via
          ./via doctor
      - uses: actions/upload-artifact@v4
        with:
          name: via-binary-${{ matrix.os }}
          path: dist/bin/
          retention-days: 7
