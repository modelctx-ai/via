name: Release

# 发布：只在 v* 标签时运行，普通的推送与 PR 不会触发。
# via 只通过 npm 分发（docs/adr/0023-npm-is-the-only-distribution-channel.md）：这里把 @modelctx-ai/via 发到 npm，
# 成功之后建 GitHub Release（带自动生成的发布说明，不附任何文件）。
# npm 上的 trusted publisher 登记的是这个文件名（release.yml）。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # npm 的 trusted publisher 用 OIDC，不读 NPM_TOKEN。npm CLI 11.5.1+ 才会走这条登录路径。
  # 公开仓库发布公开包时，provenance 由 registry 自动附带，不必再加 --provenance。
  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "package.json version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm publish

  release:
    name: GitHub Release
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
