<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
  <title id="t">via 的工作原理</title>
  <desc id="d">agent 在 shell 里执行 via 命令；via 用 MCP 与各 server 通信，返回紧凑输出。</desc>
  <style>
    :root { --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --text:#1f2328; --muted:#59636e; --line:#8c959f; --accent:#c2410c; --accent-soft:#fff4eb; --pill:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#9198a1; --line:#6e7681; --accent:#ff8a3d; --accent-soft:#33200f; --pill:#0d1117; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 18px; font-weight: 600; }
    .h2 { font-size: 15px; font-weight: 600; }
    .b { font-size: 12.5px; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .cap { font-size: 10.5px; fill: var(--muted); letter-spacing: .06em; }
    .accent { fill: var(--accent); }
    .panel { fill: var(--panel); stroke: var(--border); }
    .group { fill: var(--accent-soft); stroke: var(--accent); }
    .card { fill: var(--bg); stroke: var(--border); }
    .pill { fill: var(--pill); stroke: var(--border); }
    .ctx { fill: none; stroke: var(--border); stroke-dasharray: 4 3; }
    .wire { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .wire-accent { stroke: var(--accent); stroke-width: 1.6; fill: none; }
    .head { fill: var(--line); }
    .head-accent { fill: var(--accent); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-accent" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect width="1000" height="430" rx="12" fill="var(--bg)"/>

  <!-- agent -->
  <rect class="panel" x="24" y="60" width="220" height="210" rx="12"/>
  <text class="h" x="44" y="92">Agent</text>
  <text class="s" x="44" y="113">Claude Code · Cursor · Codex …</text>
  <rect class="ctx" x="40" y="130" width="188" height="122" rx="8"/>
  <text class="cap" x="54" y="152">上下文</text>
  <text class="b" x="54" y="178">约 200 token 的说明</text>
  <text class="b" x="54" y="198">来自 via prompt</text>
  <text class="s" x="54" y="230">不含工具 schema</text>

  <!-- agent <-> CLI -->
  <line class="wire-accent" x1="246" y1="110" x2="382" y2="110" marker-end="url(#aa)"/>
  <text class="b" x="314" y="100" text-anchor="middle">shell 命令</text>
  <text class="b mono accent" x="314" y="128" text-anchor="middle">$ via …</text>
  <line class="wire" x1="382" y1="170" x2="246" y2="170" marker-end="url(#a)"/>
  <text class="b" x="314" y="160" text-anchor="middle">紧凑输出</text>
  <text class="s" x="314" y="188" text-anchor="middle">退出码 · next: 提示</text>

  <!-- via -->
  <rect class="group" x="384" y="40" width="280" height="282" rx="14"/>
  <text class="h accent" x="402" y="66">via</text>
  <rect class="card" x="400" y="80" width="248" height="100" rx="10"/>
  <text class="h2" x="418" y="108">via CLI</text>
  <text class="b" x="418" y="132">解析参数 · 解析名称 · 渲染</text>
  <text class="b" x="418" y="152">退出码 · next: 提示</text>
  <line class="wire" x1="524" y1="182" x2="524" y2="212" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="534" y="201">本机 socket</text>
  <rect class="card" x="400" y="214" width="248" height="94" rx="10"/>
  <text class="h2" x="418" y="240">via daemon</text>
  <text class="s" x="418" y="259">按需拉起 · 空闲退出</text>
  <text class="b" x="418" y="280">MCP 会话 · 工具目录</text>
  <text class="b" x="418" y="298">凭证注入</text>

  <!-- daemon <-> servers -->
  <line class="wire" x1="650" y1="262" x2="802" y2="262" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="b" x="733" y="252" text-anchor="middle">MCP</text>
  <text class="s" x="733" y="280" text-anchor="middle">stdio / HTTP</text>

  <!-- servers -->
  <rect class="panel" x="804" y="60" width="172" height="250" rx="12"/>
  <text class="h" x="822" y="92">MCP servers</text>
  <text class="s" x="822" y="113">stdio · Streamable HTTP</text>
  <rect class="pill" x="820" y="130" width="140" height="28" rx="14"/><text class="b" x="838" y="149">GitHub</text>
  <rect class="pill" x="820" y="166" width="140" height="28" rx="14"/><text class="b" x="838" y="185">Linear</text>
  <rect class="pill" x="820" y="202" width="140" height="28" rx="14"/><text class="b" x="838" y="221">Notion</text>
  <rect class="pill" x="820" y="238" width="140" height="28" rx="14"/><text class="b" x="838" y="257">Playwright</text>
  <text class="s" x="838" y="290">…</text>

  <!-- inputs -->
  <line class="wire" x1="403" y1="352" x2="403" y2="326" marker-end="url(#a)"/>
  <line class="wire" x1="645" y1="352" x2="645" y2="326" marker-end="url(#a)"/>
  <rect class="panel" x="288" y="354" width="230" height="58" rx="10"/>
  <text class="h2" x="306" y="378" style="font-size:13.5px">框架 MCP 配置</text>
  <text class="s" x="306" y="398">只读，从不写入</text>
  <rect class="panel" x="530" y="354" width="230" height="58" rx="10"/>
  <text class="h2" x="548" y="378" style="font-size:13.5px">凭证</text>
  <text class="s" x="548" y="398">env · file · keychain · cmd · OAuth</text>
</svg>
