id: linear-my-work
title: Review my work and close one issue
goal: >
  List the Linear issues assigned to me that are in progress, read the most urgent one, and mark
  it done.
servers: [linear]

native:
  rounds:
    - - server: linear
        tool: list_my_issues
        args: { state: In Progress, limit: 10 }
    - - server: linear
        tool: get_issue
        args: { id: PLT-300 }
    - - server: linear
        tool: update_issue
        args: { id: PLT-300, state: Done }

calls:
  - { server: linear, tool: list_my_issues, resultFile: recordings/linear-my-work/list_my_issues.json }
  # Two issues tie for "most urgent" (priority High); either one is a valid pick. The canned
  # results are keyed by id, so reading or updating any other issue fails like it would for real.
  - { server: linear, tool: get_issue, args: { id: PLT-300 }, resultFile: recordings/linear-my-work/get_issue.json }
  - { server: linear, tool: get_issue, args: { id: PLT-328 }, resultFile: recordings/linear-my-work/get_issue_PLT-328.json }
  - { server: linear, tool: update_issue, args: { id: PLT-300 }, resultFile: recordings/linear-my-work/update_issue.json }
  - { server: linear, tool: update_issue, args: { id: PLT-328 }, resultFile: recordings/linear-my-work/update_issue_PLT-328.json }

via:
  - run: via linear
  # 0.4-dev (#34)：这个任务没有 -h，无需改动：资源视图的签名 `[state], [limit:num], [cursor]` 够写出 my-issue:list。
  - run: via linear my-issue
  - run: via linear my-issue:list --state "In Progress" --limit 10
  - run: via linear issue
  - run: via linear issue:get --id PLT-300
  - run: via linear issue:update --id PLT-300 --state Done

mcp2cli:
  - run: mcp2cli @linear --list
  - run: mcp2cli @linear list-my-issues --help
  - run: mcp2cli @linear list-my-issues --state "In Progress" --limit 10
  - run: mcp2cli @linear get-issue --help
  - run: mcp2cli @linear get-issue --id PLT-300
  - run: mcp2cli @linear update-issue --help
  - run: mcp2cli @linear update-issue --id PLT-300 --state Done

mcpc:
  - run: mcpc connect ./mcp.json:linear @linear
  - run: mcpc @linear tools-get list_my_issues
  - run: mcpc @linear tools-call list_my_issues state:="In Progress" limit:=10
  - run: mcpc @linear tools-get get_issue
  - run: mcpc @linear tools-call get_issue id:=PLT-300
  - run: mcpc @linear tools-get update_issue
  - run: mcpc @linear tools-call update_issue id:=PLT-300 state:=Done

# Agent evaluation: the run succeeded when the replay server saw these calls (bench/README.md).
# PLT-300 and PLT-328 are both High; either is a correct pick.
success:
  require:
    - { server: linear, tool: list_my_issues, args: { state: { $regex: progress } } }
    - { server: linear, tool: get_issue, args: { id: { $oneOf: [PLT-300, PLT-328] } } }
    - server: linear
      tool: update_issue
      args: { id: { $oneOf: [PLT-300, PLT-328] }, state: { $regex: done } }
      max: 1
  forbid:
    - { server: linear, tool: update_issue, args: { id: { $not: { $oneOf: [PLT-300, PLT-328] } } } }
