id: cross-issue-to-pr
title: Link a Linear issue to its GitHub PR
goal: >
  Read Linear issue PLT-300, find the open GitHub pull request in acme/api that fixes it, and
  comment the PR link on the Linear issue.
servers: [linear, github]

native:
  rounds:
    - - server: linear
        tool: get_issue
        args: { id: PLT-300 }
    - - server: github
        tool: search_pull_requests
        args: { query: "repo:acme/api is:pr is:open PLT-300", perPage: 5 }
    - - server: linear
        tool: create_comment
        args: { issueId: PLT-300, body: "Fix is in review: https://github.com/acme/api/pull/487" }

calls:
  - { server: linear, tool: get_issue, args: { id: PLT-300 }, resultFile: recordings/cross-issue-to-pr/get_issue.json }
  - { server: github, tool: search_pull_requests, resultFile: recordings/cross-issue-to-pr/search_pull_requests.json }
  - { server: linear, tool: create_comment, resultFile: recordings/cross-issue-to-pr/create_comment.json }

via:
  - run: via find "get linear issue"
  - run: via linear issue:get --id PLT-300
  - run: via find "search pull requests"
  - run: via github pull-request:search --query "repo:acme/api is:pr is:open PLT-300" --per-page 5
  - run: via linear comment
  - run: >-
      via linear comment:create --issue-id PLT-300 --body "Fix is in review: https://github.com/acme/api/pull/487"

mcp2cli:
  - run: mcp2cli @linear --list
  - run: mcp2cli @linear get-issue --help
  - run: mcp2cli @linear get-issue --id PLT-300
  - run: mcp2cli @github --search pull
  - run: mcp2cli @github search-pull-requests --help
  - run: mcp2cli @github search-pull-requests --query "repo:acme/api is:pr is:open PLT-300" --per-page 5
  - run: mcp2cli @linear create-comment --help
  - run: >-
      mcp2cli @linear create-comment --issue-id PLT-300 --body "Fix is in review: https://github.com/acme/api/pull/487"

mcpc:
  - run: mcpc connect ./mcp.json:linear @linear
  - run: mcpc @linear tools-get get_issue
  - run: mcpc @linear tools-call get_issue id:=PLT-300
  - run: mcpc connect ./mcp.json:github @github
  - run: mcpc @github tools-get search_pull_requests
  - run: mcpc @github tools-call search_pull_requests query:="repo:acme/api is:pr is:open PLT-300" perPage:=5
  - run: mcpc @linear tools-get create_comment
  - run: >-
      mcpc @linear tools-call create_comment issueId:=PLT-300 body:="Fix is in review: https://github.com/acme/api/pull/487"

# Agent evaluation: the run succeeded when the replay server saw these calls (bench/README.md).
# Three PRs match the search; only 487 fixes PLT-300, so only its number may reach the comment.
success:
  require:
    - { server: linear, tool: get_issue, args: { id: PLT-300 } }
    - server: linear
      tool: create_comment
      args: { issueId: { $oneOf: [PLT-300, 5f3e0c1a-0300-4a2b-9c1d-0e7b6a5d4c3b] }, body: { $regex: '\b487\b' } }
      max: 1
  forbid:
    - { server: linear, tool: create_comment, args: { body: { $regex: '\b(482|455)\b' } } }
