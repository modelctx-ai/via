id: notion-update-doc
title: Find a page and record a decision
goal: >
  Find the "Q3 Roadmap" page in Notion, read it, and add a decision under "Open questions": per-tenant
  limits will be exposed in the public API docs.
servers: [notion]

native:
  rounds:
    - - server: notion
        tool: notion-search
        args: { query: Q3 roadmap, page_size: 5 }
    - - server: notion
        tool: notion-fetch
        args: { id: 2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701 }
    - - server: notion
        tool: notion-update-page
        args:
          page_id: 2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701
          command: insert_content_after
          old_str: "- Who owns the on-call runbook for the new queue?"
          new_str: "- Decision: per-tenant limits will be exposed in the public API docs."

calls:
  - { server: notion, tool: notion-search, resultFile: recordings/notion-update-doc/notion-search.json }
  - { server: notion, tool: notion-fetch, resultFile: recordings/notion-update-doc/notion-fetch.json }
  - { server: notion, tool: notion-update-page, resultFile: recordings/notion-update-doc/notion-update-page.json }

via:
  - run: via notion
  # 0.4-dev (#34)：保留这条 -h。它前面是 `via notion`（provider 视图，只列资源名与叶子工具名，没有签名；不是 find，也不是资源视图），
  # 看不到 search 的参数。
  - run: via notion search -h
  - run: via notion search --query "Q3 roadmap" --page-size 5
  - run: via notion fetch --id 2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701
  - run: via notion page
  # 0.4-dev (#34)：保留这条 -h。`via notion page` 里 `page:update` 的 command 是长枚举（update_properties、replace_content、
  # insert_content_after …），签名里不写（枚举连起来超过 60 个字符不进签名）；要用的取值 insert_content_after 只有 -h 里才能确认。
  - run: via notion page:update -h
  - run: >-
      via notion page:update --page-id 2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701 --command insert_content_after --old-str "- Who owns the on-call runbook for the new queue?" --new-str "- Decision: per-tenant limits will be exposed in the public API docs."

mcp2cli:
  - run: mcp2cli @notion --search search
  - run: mcp2cli @notion notion-search --help
  - run: mcp2cli @notion notion-search --query "Q3 roadmap" --page-size 5
  - run: mcp2cli @notion notion-fetch --help
  - run: mcp2cli @notion notion-fetch --id 2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701
  - run: mcp2cli @notion notion-update-page --help
  - run: >-
      mcp2cli @notion notion-update-page --page-id 2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701 --command insert_content_after --old-str "- Who owns the on-call runbook for the new queue?" --new-str "- Decision: per-tenant limits will be exposed in the public API docs."

mcpc:
  - run: mcpc connect ./mcp.json:notion @notion
  - run: mcpc @notion tools-get notion-search
  - run: mcpc @notion tools-call notion-search query:="Q3 roadmap" page_size:=5
  - run: mcpc @notion tools-get notion-fetch
  - run: mcpc @notion tools-call notion-fetch id:=2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701
  - run: mcpc @notion tools-get notion-update-page
  - run: >-
      mcpc @notion tools-call notion-update-page page_id:=2f1c9e4a-7b6d-4e3f-a1b2-c3d4e5f6a701 command:=insert_content_after old_str:="- Who owns the on-call runbook for the new queue?" new_str:="- Decision: per-tenant limits will be exposed in the public API docs."

# Agent evaluation: the run succeeded when the replay server saw these calls (bench/README.md).
success:
  require:
    - { server: notion, tool: notion-search, args: { query: { $contains: roadmap } } }
    - { server: notion, tool: notion-fetch, args: { id: { $regex: "2f1c9e4a-?7b6d-?4e3f-?a1b2-?c3d4e5f6a701" } } }
    - server: notion
      tool: notion-update-page
      args:
        page_id: { $regex: "^2f1c9e4a-?7b6d-?4e3f-?a1b2-?c3d4e5f6a701$" }
        command: { $oneOf: [insert_content_after, replace_content_range, replace_content] }
        new_str: { $containsAll: [tenant, public API docs] }
      max: 1
  forbid:
    - { server: notion, tool: notion-update-page, args: { page_id: { $not: { $regex: "2f1c9e4a-?7b6d-?4e3f-?a1b2-?c3d4e5f6a701" } } } }
