id: linear-create-issue
title: File a bug in a team
goal: >
  File a high-priority bug in the Platform team's Linear, assigned to me, about the rate limiter
  failing closed when Redis is down.
servers: [linear]

native:
  rounds:
    - - server: linear
        tool: list_teams
        args: { query: Platform }
    - - server: linear
        tool: create_issue
        args:
          title: Rate limiter fails closed when Redis is down
          team: Platform
          description: Every request returns 500 while Redis is unreachable. The limiter should fail open and log a warning.
          priority: 2
          assignee: me
          labels: [Bug]

calls:
  - { server: linear, tool: list_teams, resultFile: recordings/linear-create-issue/list_teams.json }
  - { server: linear, tool: create_issue, resultFile: recordings/linear-create-issue/create_issue.json }

via:
  - run: via linear
  - run: via linear team:list --query Platform
  - run: via linear issue
  - run: >-
      via linear issue:create --title "Rate limiter fails closed when Redis is down" --team Platform --description "Every request returns 500 while Redis is unreachable. The limiter should fail open and log a warning." --priority 2 --assignee me --labels Bug

mcp2cli:
  - run: mcp2cli @linear --list
  - run: mcp2cli @linear list-teams --help
  - run: mcp2cli @linear list-teams --query Platform
  - run: mcp2cli @linear create-issue --help
  - run: >-
      mcp2cli @linear create-issue --title "Rate limiter fails closed when Redis is down" --team Platform --description "Every request returns 500 while Redis is unreachable. The limiter should fail open and log a warning." --priority 2 --assignee me --labels '["Bug"]'

# Agent evaluation: the run succeeded when the replay server saw these calls (bench/README.md).
# Linear priorities: 1 urgent, 2 high; the fixture's tool schema does not say, so both count.
success:
  require:
    - server: linear
      tool: create_issue
      args:
        title: { $regex: rate.?limiter }
        team: { $oneOf: [Platform, PLT, a1b2c3d4-0000-4000-8000-000000000000] }
        description: { $contains: redis }
        priority: { $oneOf: [2, 1, High] }
        assignee: { $oneOf: [me, jdoe] }
      max: 1
