sources: auto
servers:
  github:
    auth: { bearer: "keychain:via/github" }
    domain: code
    timeout: 90
  exa:                       # defined by Claude Code and Cursor; only the credential is added
    env: { EXA_API_KEY: "env:EXA_KEY", EXA_LOG: debug }
    budget: 4096
  linear:
    auth: oauth
  aster:                     # a gateway is an ordinary HTTP server
    url: http://127.0.0.1:3721/mcp
    auth: { bearer: "env:ASTERLANE_KEY" }
  find:                      # collides with a built-in subcommand
    url: http://127.0.0.1:3722/mcp
    alias: finder
  playwright:
    exclusive: true
    rename: { browser_navigate: "page:go" }
    noise: [trace_id]
  ghost:                     # overrides for a server nobody defines
    timeout: 5
deny: ["^github/.*:delete$", "^notion/page:(delete|move)$"]
domains:
  research: [exa, context7]
daemon:
  idleTimeout: 300
